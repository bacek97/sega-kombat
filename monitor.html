<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sega Genesis — Monitor</title>
<link rel="icon" href="data:,">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{color-scheme:dark} *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#0d0f14;color:#e6e8ee;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
  h1{font-size:20px;font-weight:600;margin:10px 0 20px;color:#7dd3fc}
  .panel{background:#161a22;border:1px solid #262b36;border-radius:12px;padding:16px 20px;
         margin-bottom:16px;width:100%;max-width:900px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .item{background:#10131a;border-radius:8px;padding:10px 12px}
  .label{font-size:11px;text-transform:uppercase;color:#7a8296;letter-spacing:.05em}
  .value{font-size:18px;font-weight:600;margin-top:4px;word-break:break-all}
  .ok{color:#4ade80} .bad{color:#f87171}
  #swapBtn{background:#262b36;color:#e6e8ee;border:1px solid #3a4152;padding:8px 16px;
           border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin-top:12px}
  #chooseBtn{background:linear-gradient(180deg,#3b82f6,#2563eb);color:#fff;border:none;padding:12px 24px;
             border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
  .panel a{color:#7dd3fc}
  body.dragover::after{content:'Отпустите файл, чтобы запустить игру';position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;background:rgba(13,15,20,.85);
    border:3px dashed #3b82f6;border-radius:16px;font-size:20px;color:#7dd3fc;z-index:99;pointer-events:none}
  #fileInput{display:none}
  #gameWrap{width:100%;max-width:900px;aspect-ratio:16/9;background:#000;border-radius:12px;
            overflow:hidden;border:1px solid #262b36;display:none}
  #game{width:100%;height:100%}
  .qr{display:inline-block;padding:8px;background:#fff;border-radius:8px;margin-top:8px}
  .qr img{display:block;width:180px;height:180px}
  .qrurl{font-size:12px;color:#7a8296;margin-top:8px;word-break:break-all;max-width:480px}
</style>
</head>
<body>
<h1>Sega Mega Drive / Genesis — Monitor</h1>

<div class="panel">
  <span class="label">Комната:</span> <b id="roomId"></b>
  <div class="qr" id="qrMain"></div>
  <div class="qrurl" id="gpUrl"></div>
  <div class="qrurl">Фиксированные слоты: <a id="link1" href="#" target="_blank" rel="noopener">Player 1</a> · <a id="link2" href="#" target="_blank" rel="noopener">Player 2</a></div>
</div>

<div class="panel">
  <div class="grid">
    <div class="item"><div class="label">Gamepad 1</div><div class="value bad" id="gp1">Disconnected</div></div>
    <div class="item"><div class="label">Gamepad 2</div><div class="value bad" id="gp2">Disconnected</div></div>
    <div class="item"><div class="label">FPS</div><div class="value" id="fps">-</div></div>
    <div class="item"><div class="label">ROM</div><div class="value" id="rom">Загрузка…</div></div>
  </div>
  <button id="swapBtn">Swap P1 &#8596; P2</button>
</div>

<div class="panel"><button id="chooseBtn">Выбрать ROM вручную</button><input type="file" id="fileInput" accept=".zip,.bin,.gen,.md,.smd"></div>
<div id="gameWrap"><div id="game"></div></div>

<script type="module">
import {joinRoom} from 'https://esm.run/@trystero-p2p/torrent';

const APP_ID = 'sega-md-p2p-v1';
const ROM_URL = 'https://www.emu-land.net/consoles/genesis/roms?act=getmfl&id=23905&fid=7849';
const ROM_NAME = 'Ultimate Mortal Kombat 3 (U) [T+Rus Pirate].zip';
const PROXIES = [u => 'https://api.cors.lol/?url=' + encodeURIComponent(u)];

// ── Кэш ROM в IndexedDB ─────────────────────────────────────────────────────
class RomCache {
  static open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('sega-roms', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('roms');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  static async get() {
    try {
      const db = await RomCache.open();
      return await new Promise(res => {
        const q = db.transaction('roms').objectStore('roms').get('auto');
        q.onsuccess = () => res(q.result || null);
        q.onerror = () => res(null);
      });
    } catch { return null; }
  }
  static async set(blob) {
    try {
      const db = await RomCache.open();
      db.transaction('roms', 'readwrite').objectStore('roms').put(blob, 'auto');
    } catch { /* квота/приватный режим — не критично */ }
  }
}
const $ = id => document.getElementById(id);

// ── Ввод от геймпадов → эмулятор ────────────────────────────────────────────
class InputAdapter {
  static MAP = {UP:4, DOWN:5, LEFT:6, RIGHT:7, A:1, B:0, C:8, X:10, Y:9, Z:11, START:3, MODE:2};

  apply(msg, port) {
    const gm = window.EJS_emulator?.gameManager;
    if (!gm?.simulateInput) return;
    const send = (name, v) => gm.simulateInput(port, InputAdapter.MAP[name], v);
    if (msg.type === 'button') send(msg.button, msg.pressed ? 1 : 0);
    else if (msg.type === 'dpad') {
      send('LEFT', msg.x < 0); send('RIGHT', msg.x > 0);
      send('UP', msg.y < 0);   send('DOWN', msg.y > 0);
    }
  }
}

// ── P2P-хост комнаты: выдаёт слоты Player 1/2, принимает ввод ──────────────
class GameHost {
  constructor(roomId, ui) {
    this.ui = ui;
    this.slots = new Map();                       // peerId -> 1|2
    this.adapter = new InputAdapter();
    const room = joinRoom({appId: APP_ID}, roomId);
    const assign = room.makeAction('assign');
    this.assignAction = assign;
    const input = room.makeAction('input');
    const hello = room.makeAction('hello');
    input.onMessage = (msg, {peerId}) => {
      const player = this.slots.get(peerId);
      if (player) this.adapter.apply(msg, player - 1);
    };
    hello.onMessage = (msg, {peerId}) => {
      let slot = this.slots.get(peerId);
      if (!slot) {
        const taken = [...this.slots.values()];
        const want = msg && msg.want;
        slot = (want && !taken.includes(want)) ? want : [1, 2].find(n => !taken.includes(n));
        if (!slot) { assign.send({player: 0}, {target: peerId}); return; }
        this.slots.set(peerId, slot);
      }
      assign.send({player: slot}, {target: peerId});
      this.ui.showSlots(this.slots);
    };
    room.onPeerLeave = peer => { if (this.slots.delete(peer)) this.ui.showSlots(this.slots); };
  }
  swapSlots() {
    const p1 = [...this.slots.keys()].find(p => this.slots.get(p) === 1);
    const p2 = [...this.slots.keys()].find(p => this.slots.get(p) === 2);
    if (p1) this.slots.set(p1, 2);
    if (p2) this.slots.set(p2, 1);
    for (const [peer, slot] of this.slots) this.assignAction.send({player: slot}, {target: peer});
    this.ui.showSlots(this.slots);
  }
}

// ── UI монитора ─────────────────────────────────────────────────────────────
class MonitorUI {
  showSlots(slots) {
    for (const n of [1, 2]) {
      const on = [...slots.values()].includes(n);
      const el = $('gp' + n);
      el.textContent = on ? 'Connected' : 'Disconnected';
      el.className = 'value ' + (on ? 'ok' : 'bad');
    }
  }
  showQr(roomId) {
    $('roomId').textContent = roomId;
    const base = new URL('gamepad.html', location.href);
    base.search = '?room=' + roomId;
    $('gpUrl').textContent = base.href;
    for (const n of [1, 2]) {
      const u = new URL('gamepad.html', location.href);
      u.search = `?room=${roomId}&player=${n}`;
      $('link' + n).href = u.href;
    }
    // Глич-QR: кадры со всеми уровнями коррекции ошибок, цикл как «помехи»
    const holder = document.createElement('div');
    holder.style.cssText = 'position:absolute;left:-9999px;top:-9999px';
    document.body.appendChild(holder);
    const frames = [];
    for (const l of [QRCode.CorrectLevel.L, QRCode.CorrectLevel.M,
                     QRCode.CorrectLevel.Q, QRCode.CorrectLevel.H]) {
      try {
        const tmp = document.createElement('div');
        holder.appendChild(tmp);
        new QRCode(tmp, {text: base.href, width: 180, height: 180, correctLevel: l});
        const cvs = tmp.querySelector('canvas');
        const im = tmp.querySelector('img');
        const src = (im && im.src && im.src.startsWith('data:')) ? im.src
                  : cvs ? cvs.toDataURL('image/png') : null;
        if (src) frames.push(src);
      } catch (e) { console.warn('[qr] уровень не сгенерирован:', l, e); }
    }
    holder.remove();
    if (!frames.length) return;
    const img = document.createElement('img');
    img.src = frames[0];
    $('qrMain').appendChild(img);
    // 4 уровня × 4 поворота (0/90/180/270°) = 16 кадров, случайный порядок + дребезг
    const tick = () => {
      img.src = frames[Math.floor(Math.random() * frames.length)];
      const rot = 90 * Math.floor(Math.random() * 4);
      const dx = Math.floor(Math.random() * 5) - 2;
      const dy = Math.floor(Math.random() * 5) - 2;
      img.style.transform = `translate(${dx}px,${dy}px) rotate(${rot}deg)`;
      img.style.opacity = Math.random() < 0.2 ? 0.85 : 1;
      setTimeout(tick, 150 + Math.random() * 200);
    };
    setTimeout(tick, 250);
  }
  startEmulator(url, name) {
    $('gameWrap').style.display = 'block';
    $('rom').textContent = name;
    Object.assign(window, {EJS_player: '#game', EJS_core: 'segaMD', EJS_gameUrl: url,
      EJS_gameName: name, EJS_startOnLoaded: true, EJS_language: 'en-US',
      EJS_pathtodata: 'https://cdn.emulatorjs.org/stable/data/'});
    document.getElementById('ejs-loader')?.remove();
    const s = document.createElement('script');
    s.id = 'ejs-loader';
    s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
    document.body.appendChild(s);
    setInterval(() => {
      const fps = window.EJS_emulator?.gameManager?.getFPS?.();
      if (fps != null) $('fps').textContent = Math.round(fps);
    }, 1000);
  }
  showRomHint() {
    $('rom').innerHTML = `<a href="${ROM_URL}" target="_blank" rel="noopener" referrerpolicy="no-referrer">Скачать ROM</a> ·
      <a href="#" id="retryLoad">Повторить автозагрузку</a><br>
      <span style="font-size:12px;color:#7a8296">перетащите файл на страницу или нажмите кнопку ниже</span>`;
    $('retryLoad').onclick = e => { e.preventDefault(); this.autoLoadRom(); };
  }
  async loadRomFile(blob, name) {
    RomCache.set(blob);
    this.startEmulator(URL.createObjectURL(blob), name);
  }
  async autoLoadRom() {
    const cached = await RomCache.get();
    if (cached) return this.startEmulator(URL.createObjectURL(cached), ROM_NAME);
    $('rom').textContent = 'Автозагрузка…';
    for (const wrap of PROXIES) {
      const url = wrap(ROM_URL);
      try {
        const r = await fetch(url);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const blob = await r.blob();
        if (blob.size < 1024) throw new Error('too small');
        return this.loadRomFile(blob, ROM_NAME);
      } catch (e) { console.warn('[rom] прокси не сработал:', url, e); }
    }
    this.showRomHint();
  }
}

// ── Запуск ──────────────────────────────────────────────────────────────────
const ui = new MonitorUI();
const params = new URLSearchParams(location.search);
const roomId = params.get('room') || Math.random().toString(36).slice(2, 8);
if (!params.get('room')) history.replaceState(null, '', '?room=' + roomId);

const host = new GameHost(roomId, ui);
$('swapBtn').onclick = () => host.swapSlots();
ui.showQr(roomId);
ui.autoLoadRom();

$('chooseBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = e => {
  const f = e.target.files[0];
  if (f) ui.loadRomFile(f, f.name);
};

// ── Drag & drop ROM на страницу ──────────────────────────────────────────────
window.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragover'); });
window.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragover'); });
window.addEventListener('drop', e => {
  e.preventDefault();
  document.body.classList.remove('dragover');
  const f = e.dataTransfer.files[0];
  if (f) ui.loadRomFile(f, f.name);
});
</script>
</body>
</html>
