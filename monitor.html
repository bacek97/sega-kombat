<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sega Genesis — Monitor</title>
<link rel="icon" href="data:,">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{color-scheme:dark} *{box-sizing:border-box}
  html{background:#0d0f14}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#e6e8ee;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
  h1{font-size:20px;font-weight:600;margin:10px 0 20px;color:#7dd3fc}
  .panel{background:#161a22;border:1px solid #262b36;border-radius:12px;padding:16px 20px;
         margin-bottom:16px;width:100%;max-width:900px}
  .label{font-size:11px;text-transform:uppercase;color:#7a8296;letter-spacing:.05em}
  .ok{color:#4ade80} .bad{color:#f87171}
  .btn{display:inline-block;background:#262b36;color:#e6e8ee;border:1px solid #3a4152;padding:8px 16px;
       border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none}
  #chooseBtn{background:linear-gradient(180deg,#3b82f6,#2563eb);color:#fff;border:none;padding:12px 24px;
             border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
  .panel a{color:#7dd3fc}
  body.dragover::after{content:'Отпустите файл, чтобы запустить игру';position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;background:rgba(13,15,20,.85);
    border:3px dashed #3b82f6;border-radius:16px;font-size:20px;color:#7dd3fc;z-index:99;pointer-events:none}
  #fileInput{display:none}
  footer{margin-top:auto;width:100%;max-width:900px;border-top:1px solid #262b36;padding-top:16px}
  .foot{display:flex;gap:20px;align-items:flex-start}
  .foot .qr{margin-top:0;flex:none}
  .side{flex:1;min-width:0}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  #gameWrap{width:100%;max-width:900px;aspect-ratio:16/9;background:#000;border-radius:12px;
            overflow:hidden;border:1px solid #262b36;display:none;position:relative}
  .padOverlay{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:5}
  .ejs_virtualGamepad_parent{display:none!important}  /* контейнер встроенного геймпада EJS (emulator.js:3982) */
  :fullscreen footer,:fullscreen h1{display:none}
  :fullscreen #gameWrap{max-width:none;height:100vh;aspect-ratio:auto}
  #game{width:100%;height:100%}
  .qr{display:inline-block;padding:18px;background:#fff;border-radius:8px;margin-top:8px}
  .qr img{display:block;width:180px;height:180px}
  .qrurl{font-size:12px;color:#7a8296;margin-top:8px;word-break:break-all;max-width:480px}
</style>
</head>
<body>
<h1>Sega Mega Drive / Genesis — Monitor</h1>

<div id="gameWrap"><div id="game"></div></div>

<footer>
  <div class="panel foot">
    <div class="qr" id="qrMain"></div>
    <div class="side">
      <div class="row">
        <button id="chooseBtn">Выбрать ROM вручную</button>
      </div>
      <div class="qrurl" id="romHint"></div>
      <div class="row">
        <button id="swapBtn" class="btn">Swap &#8596;</button>
        <a id="link1" class="btn bad" href="#" target="_blank" rel="noopener">Player 1</a>
        <a id="link2" class="btn bad" href="#" target="_blank" rel="noopener">Player 2</a>
        <button id="saveBtn" class="btn">Save</button>
        <button id="loadBtn" class="btn">Load</button>
        <button id="padBtn" class="btn">Геймпад</button>
      </div>
      <input type="file" id="fileInput" accept=".zip,.bin,.gen,.md,.smd">
    </div>
  </div>
</footer>

<script type="module">
import {joinRoom} from 'https://esm.run/@trystero-p2p/torrent';

const APP_ID = 'sega-md-p2p-v1';
const RELAYS = ['wss://tracker.webtorrent.dev', 'wss://tracker.openwebtorrent.com',
                'wss://tracker.files.fm:7073/announce', 'wss://tracker.btorrent.xyz'];
const ROM_URL = 'https://www.emu-land.net/consoles/genesis/roms?act=getmfl&id=23905&fid=7849';
const ROM_NAME = 'Ultimate Mortal Kombat 3 (U) [T+Rus Pirate].zip';
const PROXIES = [u => 'https://api.cors.lol/?url=' + encodeURIComponent(u)];

// ── Кэш ROM в IndexedDB ─────────────────────────────────────────────────────
class RomCache {
  static open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('sega-roms', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('roms');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  static async get() {
    try {
      const db = await RomCache.open();
      return await new Promise(res => {
        const q = db.transaction('roms').objectStore('roms').get('auto');
        q.onsuccess = () => res(q.result || null);
        q.onerror = () => res(null);
      });
    } catch { return null; }
  }
  static async set(blob) {
    try {
      const db = await RomCache.open();
      db.transaction('roms', 'readwrite').objectStore('roms').put(blob, 'auto');
    } catch { /* квота/приватный режим — не критично */ }
  }
}
const $ = id => document.getElementById(id);

// ── Ввод от геймпадов → эмулятор ────────────────────────────────────────────
class InputAdapter {
  static MAP = {UP:4, DOWN:5, LEFT:6, RIGHT:7, A:1, B:0, C:8, X:10, Y:9, Z:11, START:3, MODE:2};

  apply(msg, port) {
    const gm = window.EJS_emulator?.gameManager;
    if (!gm?.simulateInput) return;
    const send = (name, v) => gm.simulateInput(port, InputAdapter.MAP[name], v);
    if (msg.type === 'button') send(msg.button, msg.pressed ? 1 : 0);
    else if (msg.type === 'dpad') {
      send('LEFT', msg.x < 0); send('RIGHT', msg.x > 0);
      send('UP', msg.y < 0);   send('DOWN', msg.y > 0);
    }
  }
}

// ── P2P-хост комнаты: выдаёт слоты Player 1/2, принимает ввод ──────────────
class GameHost {
  constructor(roomId, ui) {
    this.ui = ui;
    this.slots = new Map();                       // peerId|'local' -> 1|2
    this.adapter = new InputAdapter();
    this.localFrame = null;                       // iframe overlay-геймпада
    window.addEventListener('message', e => {
      if (!this.localFrame || e.source !== this.localFrame.contentWindow || !e.data) return;
      if (e.data.type === 'padReady') this.assignLocal();
      else if (e.data.type === 'pad') {
        const player = this.slots.get('local');
        if (player) this.adapter.apply(e.data.msg, player - 1);
      } else if (e.data.type === 'fs') {
        // Fullscreen именно родителя: fullscreen внутри iframe скрыл бы игру
        try {
          if (document.fullscreenElement) document.exitFullscreen();
          else document.documentElement.requestFullscreen()
            .then(() => screen.orientation?.lock('landscape').catch(() => {})).catch(() => {});
        } catch { /* нет пользовательской активации (file://) — игнор */ }
      }
    });
    const room = joinRoom({appId: APP_ID, relayUrls: RELAYS}, roomId);
    const assign = room.makeAction('assign');
    this.assignAction = assign;
    const input = room.makeAction('input');
    const hello = room.makeAction('hello');
    input.onMessage = (msg, {peerId}) => {
      const player = this.slots.get(peerId);
      if (player) this.adapter.apply(msg, player - 1);
    };
    hello.onMessage = (msg, {peerId}) => {
      let slot = this.slots.get(peerId);
      if (!slot) {
        const taken = [...this.slots.values()];
        const want = msg && msg.want;
        slot = (want && !taken.includes(want)) ? want : [1, 2].find(n => !taken.includes(n));
        if (!slot) { assign.send({player: 0}, {target: peerId}); return; }
        this.slots.set(peerId, slot);
      }
      assign.send({player: slot}, {target: peerId});
      this.ui.showSlots(this.slots);
    };
    room.onPeerLeave = peer => { if (this.slots.delete(peer)) this.ui.showSlots(this.slots); };
  }
  // Локальный overlay-геймпад (iframe): слот как у пира, но канал — postMessage
  assignLocal() {
    if (!this.localFrame) return;
    const taken = [...this.slots.values()];
    const slot = taken.includes(1) ? (taken.includes(2) ? 0 : 2) : 1;
    if (!slot) { this.detachLocalPad(); return this.ui.flash('padBtn', 'Оба слота заняты'); }
    this.slots.set('local', slot);
    this.localFrame.contentWindow.postMessage({type: 'assign', player: slot}, '*');
    this.ui.showSlots(this.slots);
  }
  detachLocalPad() {
    this.localFrame?.remove();
    this.localFrame = null;
    if (this.slots.delete('local')) this.ui.showSlots(this.slots);
  }
  swapSlots() {
    const p1 = [...this.slots.keys()].find(p => this.slots.get(p) === 1);
    const p2 = [...this.slots.keys()].find(p => this.slots.get(p) === 2);
    if (p1) this.slots.set(p1, 2);
    if (p2) this.slots.set(p2, 1);
    for (const [peer, slot] of this.slots) {
      if (peer === 'local') this.localFrame?.contentWindow.postMessage({type: 'assign', player: slot}, '*');
      else this.assignAction.send({player: slot}, {target: peer});
    }
    this.ui.showSlots(this.slots);
  }
}

// ── Кэш сохранений состояния в IndexedDB ───────────────────────────────────
class StateCache {
  static open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('sega-states', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('states');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  static async set(name, data) {
    try {
      const db = await StateCache.open();
      db.transaction('states', 'readwrite').objectStore('states').put(data, name);
    } catch { /* квота/приватный режим — не критично */ }
  }
  static async get(name) {
    try {
      const db = await StateCache.open();
      return await new Promise(res => {
        const q = db.transaction('states').objectStore('states').get(name);
        q.onsuccess = () => res(q.result || null);
        q.onerror = () => res(null);
      });
    } catch { return null; }
  }
}

// ── UI монитора ─────────────────────────────────────────────────────────────
class MonitorUI {
  showSlots(slots) {
    for (const n of [1, 2]) {
      const on = [...slots.values()].includes(n);
      $('link' + n).className = 'btn ' + (on ? 'ok' : 'bad');
    }
  }
  showQr(roomId) {
    const base = new URL('gamepad.html', location.href);
    base.search = '?room=' + roomId;
    for (const n of [1, 2]) {
      const u = new URL('gamepad.html', location.href);
      u.search = `?room=${roomId}&player=${n}`;
      $('link' + n).href = u.href;
    }
    // Кадры со всеми уровнями коррекции ошибок
    const holder = document.createElement('div');
    holder.style.cssText = 'position:absolute;left:-9999px;top:-9999px';
    document.body.appendChild(holder);
    const frames = [];
    for (const l of [QRCode.CorrectLevel.L, QRCode.CorrectLevel.M,
                     QRCode.CorrectLevel.Q, QRCode.CorrectLevel.H]) {
      try {
        const tmp = document.createElement('div');
        holder.appendChild(tmp);
        const q = new QRCode(tmp, {text: base.href, width: 500, height: 500, correctLevel: l});
        const cvs = tmp.querySelector('canvas');
        const modules = q._oQRCode ? q._oQRCode.getModuleCount() : 33;
        if (cvs) frames.push({cvs, modules});
      } catch (e) { console.warn('[qr] уровень не сгенерирован:', l, e); }
    }
    holder.remove();
    if (!frames.length) return;
    // Главный QR — статичный, уровень H читается лучше всего
    const img = document.createElement('img');
    img.src = frames[frames.length - 1].cvs.toDataURL('image/png');
    $('qrMain').appendChild(img);
  }
  startEmulator(url, name) {
    $('gameWrap').style.display = 'block';
    $('chooseBtn').textContent = 'ROM: ' + name;
    $('romHint').innerHTML = '';
    this.romName = name;
    Object.assign(window, {EJS_player: '#game', EJS_core: 'segaMD', EJS_gameUrl: url,
      EJS_gameName: name, EJS_startOnLoaded: true, EJS_language: 'en-US',
      EJS_Buttons: {gamepad: false},                         // кнопка виртуального геймпада EJS не нужна
      EJS_defaultOptions: {'virtual-gamepad': 'disabled'},   // значения 'enabled'/'disabled' (emulator.js:5625)
      EJS_pathtodata: 'https://cdn.emulatorjs.org/stable/data/'});
    document.getElementById('ejs-loader')?.remove();
    const s = document.createElement('script');
    s.id = 'ejs-loader';
    s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
    document.body.appendChild(s);
  }
  flash(btnId, text) {
    const b = $(btnId), old = b.textContent;
    b.textContent = text;
    setTimeout(() => b.textContent = old, 1500);
  }
  async saveState() {
    const gm = window.EJS_emulator?.gameManager;
    if (!gm?.getState) return this.flash('saveBtn', 'Эмулятор не запущен');
    const data = await Promise.resolve(gm.getState());
    await StateCache.set(this.romName, data);
    this.flash('saveBtn', 'Сохранено');
  }
  async loadState() {
    const gm = window.EJS_emulator?.gameManager;
    if (!gm?.loadState) return this.flash('loadBtn', 'Эмулятор не запущен');
    const data = await StateCache.get(this.romName);
    if (!data) return this.flash('loadBtn', 'Нет сохранения');
    gm.loadState(data);
    this.flash('loadBtn', 'Загружено');
  }
  showRomHint() {
    $('romHint').innerHTML = `<a href="${ROM_URL}" target="_blank" rel="noopener" referrerpolicy="no-referrer">Скачать ROM</a> ·
      <a href="#" id="retryLoad">Повторить автозагрузку</a> ·
      перетащите файл на страницу или нажмите кнопку выше`;
    $('retryLoad').onclick = e => { e.preventDefault(); this.autoLoadRom(); };
  }
  async loadRomFile(blob, name) {
    RomCache.set(blob);
    this.startEmulator(URL.createObjectURL(blob), name);
  }
  async autoLoadRom() {
    const cached = await RomCache.get();
    if (cached) return this.startEmulator(URL.createObjectURL(cached), ROM_NAME);
    $('chooseBtn').textContent = 'Автозагрузка ROM…';
    for (const wrap of PROXIES) {
      const url = wrap(ROM_URL);
      try {
        const r = await fetch(url);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const blob = await r.blob();
        if (blob.size < 1024) throw new Error('too small');
        return this.loadRomFile(blob, ROM_NAME);
      } catch (e) { console.warn('[rom] прокси не сработал:', url, e); }
    }
    this.showRomHint();
  }
}

// ── Запуск ──────────────────────────────────────────────────────────────────
const ui = new MonitorUI();
const params = new URLSearchParams(location.search);
const roomId = params.get('room') || Math.random().toString(36).slice(2, 8);
if (!params.get('room')) history.replaceState(null, '', '?room=' + roomId);

const host = new GameHost(roomId, ui);
$('swapBtn').onclick = () => host.swapSlots();
$('saveBtn').onclick = () => ui.saveState();
$('loadBtn').onclick = () => ui.loadState();
$('padBtn').onclick = () => {
  if (host.localFrame) return host.detachLocalPad();       // повторный клик — скрыть
  if ($('gameWrap').style.display !== 'block') return ui.flash('padBtn', 'Сначала загрузите ROM');
  const f = document.createElement('iframe');
  f.id = 'padOverlay';
  f.className = 'padOverlay';
  const u = new URL('gamepad.html', location.href);        // тот же геймпад, ввод напрямую
  u.search = `?room=${roomId}&player=1&embed=1`;
  f.src = u.href;
  $('gameWrap').appendChild(f);
  host.localFrame = f;                                     // слот выдастся по сигналу padReady
};
ui.showQr(roomId);
ui.autoLoadRom();

$('chooseBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = e => {
  const f = e.target.files[0];
  if (f) ui.loadRomFile(f, f.name);
};

// ── Drag & drop ROM на страницу ──────────────────────────────────────────────
window.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragover'); });
window.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragover'); });
window.addEventListener('drop', e => {
  e.preventDefault();
  document.body.classList.remove('dragover');
  const f = e.dataTransfer.files[0];
  if (f) ui.loadRomFile(f, f.name);
});
</script>
</body>
</html>
